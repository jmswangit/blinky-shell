name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 image (arm64, macOS 27). It ships Xcode 27.0, 27.1 and 27.2.
    runs-on: xcode-27
    timeout-minutes: 30

    env:
      SCHEME: BlinkyShell
      PROJECT: BlinkyShell.xcodeproj
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'cool.swan.blinkyshell' }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      EXPORT_METHOD: ${{ vars.EXPORT_METHOD || 'ad-hoc' }}
      SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY || 'Apple Distribution' }}
      HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27.2 (fall back to newest 27.x)
        run: |
          set -euo pipefail
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          PICK=""
          for candidate in \
            /Applications/Xcode_27.2.app \
            /Applications/Xcode_27.2_Release_Candidate.app; do
            if [ -d "$candidate" ]; then
              PICK="$candidate"
              break
            fi
          done

          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$PICK" ]; then
            PICK=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$PICK" ]; then
            echo "No Xcode installation found." >&2
            exit 1
          fi

          echo "Using $PICK"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iOS" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        if: env.HAS_CERT != 'true'
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          rm -rf Payload
          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${SCHEME}.app" Payload/
          rm -f "BlinkyShell-unsigned.ipa"
          zip -qry "BlinkyShell-unsigned.ipa" Payload
          echo "Built BlinkyShell-unsigned.ipa"

      - name: Build and export signed IPA
        if: env.HAS_CERT == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${TEAM_ID:-}" ]; then
            echo "Set the TEAM_ID repository variable (10-character Apple Team ID)." >&2
            exit 1
          fi
          if [ -z "${PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "Set the PROVISIONING_PROFILE_BASE64 secret." >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$BUILD_CERTIFICATE_BASE64" | python3 -c "import sys,base64; open('$CERT_PATH','wb').write(base64.b64decode(sys.stdin.read()))"
          echo "$PROVISIONING_PROFILE_BASE64" | python3 -c "import sys,base64; open('$PROFILE_PATH','wb').write(base64.b64decode(sys.stdin.read()))"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          echo "Provisioning profile: $PROFILE_NAME ($PROFILE_UUID)"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          xcodegen generate

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/BlinkyShell.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

          export TEAM_ID BUNDLE_ID PROFILE_NAME EXPORT_METHOD
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "signingStyle": "manual",
              "teamID": os.environ["TEAM_ID"],
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "compileBitcode": False,
              "stripSwiftSymbols": True,
              "thinning": "<none>",
          }
          with open("ExportOptions.plist", "wb") as handle:
              plistlib.dump(options, handle)
          PY

          xcodebuild \
            -exportArchive \
            -archivePath build/BlinkyShell.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

          ls -la build/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlinkyShell-ipa
          path: |
            *.ipa
            build/export/*.ipa
          if-no-files-found: error
          retention-days: 30
