name: BlinkyShell

options:
  bundleIdPrefix: cool.swan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BlinkyShell:
    type: application
    platform: iOS
    sources:
      - path: BlinkyShell
        excludes:
          - "Info.plist"
          - "BlinkyShell.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cool.swan.blinkyshell
        PRODUCT_NAME: BlinkyShell
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BlinkyShell/BlinkyShell.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: BlinkyShell/Info.plist
      properties:
        CFBundleDisplayName: Homepage
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: Homepage
        CFBundlePackageType: APPL
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: cool.swan.blinkyshell.session
            CFBundleURLSchemes:
              - blinkyshell
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Blinky connects to your self-hosted apps on the local network.
        NSBonjourServices:
          - _http._tcp
          - _https._tcp
        ITSAppUsesNonExemptEncryption: false

schemes:
  BlinkyShell:
    build:
      targets:
        BlinkyShell: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
